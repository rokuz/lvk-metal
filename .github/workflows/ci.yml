name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-tests:
    name: Screenshot tests (${{ matrix.mode }})
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: ${{ matrix.mode == 'tsan' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: normal,   flag: "",          builddir: build }
          - { mode: asan,     flag: "--asan",     builddir: build-asan }
          - { mode: tsan,     flag: "--tsan",     builddir: build-tsan }
          - { mode: coverage, flag: "--coverage", builddir: build-coverage }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install KosmicKrisp # LVK requirement
        run: |
          KK="$HOME/.cache/kosmickrisp/mesa-26.2.1"
          if [ ! -f "$KK/lib/libvulkan.dylib" ]; then
            mkdir -p "$KK"
            curl -fsSL -o "$KK.zip" "https://github.com/rokuz/kosmickrisp-binaries/releases/download/mesa-mesa-26.2.1/kosmickrisp-macos-arm64.zip"
            unzip -q -o "$KK.zip" -d "$KK"
          fi
          echo "KK_INCLUDE=$KK/deps/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "KK_LIB=$KK/lib/libvulkan.dylib" >> "$GITHUB_ENV"

      - name: Deploy sample content
        working-directory: 3party/src/lightweightvk
        run: |
          python3 deploy_content.py
          command -v git-lfs >/dev/null || brew install git-lfs
          KTX=third-party/deps/src/ktx-software
          if [ -d "$KTX/.git" ]; then
            git -C "$KTX" lfs install --local
            git -C "$KTX" lfs pull --include "tests/srcimages/Iron_Bars/*"
          fi

      - name: Build + screenshot tests
        run: python3 tests/run_screenshot_tests.py ${{ matrix.flag }}

      - name: Upload screenshot deltas on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-deltas-${{ matrix.mode }}
          path: ${{ matrix.builddir }}/_out/*.png
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always() && matrix.mode == 'coverage'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.builddir }}/coverage.lcov
          disable_search: true
